site_name: Agent Design Patterns
site_description: A visual guide to agentic systems in modern software architecture
site_url: ""
repo_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - navigation.footer
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Foundations:
    - The Agentic Spectrum: posts/01-the-agentic-spectrum.md
    - The Six Patterns: posts/02-the-six-patterns.md
  - Applied Architecture:
    - Distributed Systems: posts/03-agents-in-distributed-systems.md
    - Microservices: posts/04-agents-in-microservices.md
    - Web Applications: posts/05-agents-in-web-applications.md
  - System Design:
    - Multi-Agent Architecture: posts/06-multi-agent-system-architecture.md
    - Production Playbook: posts/07-production-playbook.md
  - The Future:
    - How Software Changes: posts/08-the-future-of-software-systems.md
    - Deep Challenges: posts/09-deep-challenges.md
